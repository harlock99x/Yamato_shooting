<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小野めぐり珈琲バッグ 管理者画面（完全版）</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- QRCode.js (QRコード画像一括生成用) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <!-- Firebase SDK (v9 Modular) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, getDocs, deleteDoc, updateDoc, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAcLiObsI5p_dpGfpERStBHx2J322sO95U",
          authDomain: "ono-coffee-passport.firebaseapp.com",
          projectId: "ono-coffee-passport",
          storageBucket: "ono-coffee-passport.firebasestorage.app",
          messagingSenderId: "537440513359",
          appId: "1:537440513359:web:973793d14ff9b6e382693a",
          measurementId: "G-585ENGFG8G"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let cachedStores = [];
        let cachedCodes = [];
        let editingStoreId = null; // 編集中の店舗ID保持用

        // 認証判定
        window.checkPassword = function() {
            const input = document.getElementById('pass-input').value;
            if (input === 'nekoaso') {
                document.getElementById('login-view').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                refreshData();
            } else {
                alert('パスワードが違います');
            }
        };

        // 一括データ更新
        async function refreshData() {
            await Promise.all([loadStores(), loadCodes()]);
            renderAnalytics();
        }

        // --- 📊 集計・ダッシュボード機能 ---
        function renderAnalytics() {
            const totalCodes = cachedCodes.length;
            let activeCodesCount = 0;
            let totalRedemptions = 0;
            const storeUsageMap = {};

            cachedCodes.forEach(c => {
                const used = c.used_stores || [];
                if (used.length > 0 || c.expires_at) activeCodesCount++;
                totalRedemptions += used.length;
                used.forEach(storeId => {
                    storeUsageMap[storeId] = (storeUsageMap[storeId] || 0) + 1;
                });
            });

            document.getElementById('stat-total-codes').innerText = totalCodes;
            document.getElementById('stat-active-codes').innerText = activeCodesCount;
            document.getElementById('stat-total-use').innerText = totalRedemptions;

            const rankingEl = document.getElementById('analytics-store-ranking');
            rankingEl.innerHTML = '';
            cachedStores.forEach(s => {
                const count = storeUsageMap[s.id] || 0;
                const row = document.createElement('div');
                row.className = 'flex justify-between items-center text-xs border-b pb-1.5';
                row.innerHTML = `
                    <span class="font-bold text-gray-700">${s.name} ${s.is_seller ? '☕' : ''}</span>
                    <span class="bg-amber-100 text-amber-800 px-2 py-0.5 rounded font-bold">${count} 回利用</span>
                `;
                rankingEl.appendChild(row);
            });
        }

        // CSVエクスポート
        window.exportCSV = function() {
            if (cachedCodes.length === 0) {
                alert('出力するデータがありません');
                return;
            }

            let csvContent = "data:text/csv;charset=utf-8,\uFEFF";
            csvContent += "シリアルコード,有効期限,利用店舗数,利用店舗IDリスト\n";

            cachedCodes.forEach(c => {
                const usedStoresStr = (c.used_stores || []).join(';');
                const expireStr = c.expires_at ? c.expires_at.toDate().toLocaleDateString() : '未開始';
                csvContent += `"${c.id}","${expireStr}",${(c.used_stores || []).length},"${usedStoresStr}"\n`;
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `coffee_passport_data_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        };


        // --- 🏪 店舗管理機能 ---
        async function loadStores() {
            const querySnapshot = await getDocs(collection(db, "stores"));
            const listEl = document.getElementById('admin-store-list');
            listEl.innerHTML = '';
            cachedStores = [];

            if (querySnapshot.empty) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">登録されている店舗はありません。</p>`;
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const store = docSnap.data();
                const id = docSnap.id;
                cachedStores.push({ id, ...store });

                const item = document.createElement('div');
                item.className = `p-3 rounded-lg border text-sm ${store.active === false ? 'bg-gray-100 opacity-60' : 'bg-gray-50'}`;
                item.innerHTML = `
                    <div class="flex justify-between items-start mb-1">
                        <div>
                            <span class="font-bold text-gray-800">${store.name}</span>
                            <span class="text-xs font-mono text-gray-400">(${id})</span>
                            ${store.is_seller ? '<span class="ml-1 text-xs bg-amber-100 text-amber-800 px-1.5 py-0.5 rounded font-bold">☕ 販売店</span>' : ''}
                            ${store.active === false ? '<span class="ml-1 text-xs bg-gray-300 text-gray-700 px-1.5 py-0.5 rounded">非公開</span>' : '<span class="ml-1 text-xs bg-green-100 text-green-700 px-1.5 py-0.5 rounded">公開中</span>'}
                        </div>
                        <div class="flex gap-1 shrink-0">
                            <button onclick="editStore('${id}')" class="text-xs bg-blue-100 text-blue-700 font-bold px-2 py-1 rounded hover:bg-blue-200">編集</button>
                            <button onclick="deleteStore('${id}')" class="text-xs bg-red-100 text-red-600 font-bold px-2 py-1 rounded hover:bg-red-200">削除</button>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 space-y-0.5">
                        <div>📍 ${store.address || '未設定'} | 📞 ${store.tel || '未設定'} | 🔑 PIN: <strong class="text-amber-800">${store.pin || '1234'}</strong></div>
                        <div>🕒 ${store.hours || '未設定'}</div>
                        <div class="text-amber-800 font-bold">🎁 特典: ${store.benefit}</div>
                        ${store.url ? `<div class="text-blue-600 truncate">🔗 <a href="${store.url}" target="_blank" class="underline">${store.url}</a></div>` : ''}
                    </div>
                `;
                listEl.appendChild(item);
            });
        }

        // 店舗ID完全自動生成 (例: store_01)
        function generateNextStoreId() {
            let maxNum = 0;
            cachedStores.forEach(s => {
                const match = s.id.match(/^store_(\d+)$/);
                if (match) {
                    const num = parseInt(match[1], 10);
                    if (num > maxNum) maxNum = num;
                }
            });
            return `store_${String(maxNum + 1).padStart(2, '0')}`;
        }

        window.editStore = function(id) {
            const store = cachedStores.find(s => s.id === id);
            if (!store) return;

            editingStoreId = id;
            document.getElementById('store-name').value = store.name || '';
            document.getElementById('store-pin').value = store.pin || '1234';
            document.getElementById('store-address').value = store.address || '';
            document.getElementById('store-tel').value = store.tel || '';
            document.getElementById('store-hours').value = store.hours || '';
            document.getElementById('store-url').value = store.url || '';
            document.getElementById('store-image-url').value = store.image_url || '';
            document.getElementById('store-benefit').value = store.benefit || '';
            document.getElementById('store-seller').checked = store.is_seller === true;
            document.getElementById('store-active').checked = store.active !== false;

            document.getElementById('form-title').innerText = '✏️ 店舗情報の編集・更新';
            document.getElementById('submit-btn').innerText = '店舗情報を更新する';
            document.getElementById('cancel-edit-btn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        window.cancelEdit = function() {
            resetForm();
        };

        function resetForm() {
            editingStoreId = null;
            document.getElementById('store-name').value = '';
            document.getElementById('store-pin').value = '1234';
            document.getElementById('store-address').value = '';
            document.getElementById('store-tel').value = '';
            document.getElementById('store-hours').value = '';
            document.getElementById('store-url').value = '';
            document.getElementById('store-image-url').value = '';
            document.getElementById('store-benefit').value = '';
            document.getElementById('store-seller').checked = false;
            document.getElementById('store-active').checked = true;

            document.getElementById('form-title').innerText = '＋ 参加店舗の追加';
            document.getElementById('submit-btn').innerText = '店舗をデータベースに保存';
            document.getElementById('cancel-edit-btn').classList.add('hidden');
        }

        window.addStore = async function() {
            const name = document.getElementById('store-name').value.trim();
            const pin = document.getElementById('store-pin').value.trim() || '1234';
            const address = document.getElementById('store-address').value.trim();
            const tel = document.getElementById('store-tel').value.trim();
            const hours = document.getElementById('store-hours').value.trim();
            const url = document.getElementById('store-url').value.trim();
            const image_url = document.getElementById('store-image-url').value.trim();
            const benefit = document.getElementById('store-benefit').value.trim();
            const is_seller = document.getElementById('store-seller').checked;
            const active = document.getElementById('store-active').checked;

            if (!name || !benefit) {
                alert('店舗名、特典内容は必須です');
                return;
            }

            const targetId = editingStoreId || generateNextStoreId();

            try {
                await setDoc(doc(db, "stores", targetId), {
                    name, pin, address, tel, hours, url, image_url, benefit, is_seller, active
                }, { merge: true });

                alert(`店舗「${name}」を保存しました！`);
                resetForm();
                await refreshData();
            } catch (error) {
                console.error("Error adding store:", error);
                alert('保存に失敗しました');
            }
        };

        window.deleteStore = async function(id) {
            if (confirm(`店舗 ID: ${id} を削除しますか？`)) {
                await deleteDoc(doc(db, "stores", id));
                await refreshData();
            }
        };


        // --- 🎫 シリアルコード管理 ---
        async function loadCodes() {
            const querySnapshot = await getDocs(collection(db, "codes"));
            cachedCodes = [];
            querySnapshot.forEach(docSnap => {
                cachedCodes.push({ id: docSnap.id, ...docSnap.data() });
            });
            renderCodesList(cachedCodes);
        }

        function renderCodesList(codesList) {
            const listEl = document.getElementById('admin-code-list');
            const countEl = document.getElementById('code-total-count');
            listEl.innerHTML = '';
            countEl.innerText = `(${codesList.length}件)`;

            if (codesList.length === 0) {
                listEl.innerHTML = `<p class="text-xs text-gray-400 text-center py-2">該当するコードはありません。</p>`;
                return;
            }

            const now = new Date();

            codesList.forEach(c => {
                const used = c.used_stores || [];
                
                // 有効期限の文字列＆状態ラベル生成
                let expireBadge = '<span class="text-gray-400 bg-gray-100 px-1.5 py-0.5 rounded text-[10px]">未開始</span>';
                if (c.expires_at) {
                    const expireDate = c.expires_at.toDate();
                    const expireStr = expireDate.toLocaleDateString();
                    if (now > expireDate) {
                        expireBadge = `<span class="text-red-700 bg-red-100 px-1.5 py-0.5 rounded text-[10px] font-bold">期限切れ (${expireStr})</span>`;
                    } else {
                        expireBadge = `<span class="text-blue-700 bg-blue-50 px-1.5 py-0.5 rounded text-[10px]">〜${expireStr}</span>`;
                    }
                }

                const item = document.createElement('div');
                item.className = 'bg-gray-50 p-3 rounded-lg border text-sm';
                item.innerHTML = `
                    <div class="flex justify-between items-center mb-1">
                        <div class="font-bold font-mono text-gray-800">${c.id}</div>
                        <div class="flex gap-1">
                            <button onclick="deleteCode('${c.id}')" class="text-xs bg-red-100 text-red-600 font-bold px-2 py-0.5 rounded hover:bg-red-200">削除</button>
                        </div>
                    </div>
                    <div class="text-xs text-gray-500 flex justify-between items-center">
                        <div>
                            利用数: <span class="font-bold ${used.length > 0 ? 'text-amber-600' : 'text-gray-400'}">${used.length} 店舗</span>
                        </div>
                        <div>${expireBadge}</div>
                    </div>
                    ${used.length > 0 ? `<div class="mt-1 flex flex-wrap gap-1">${used.map(sId => `<span class="bg-gray-200 text-gray-700 px-1.5 py-0.5 rounded text-[10px] flex items-center gap-1">${sId} <button onclick="resetSingleRedemption('${c.id}', '${sId}')" class="text-red-500 font-bold hover:text-red-700">✕</button></span>`).join('')}</div>` : ''}
                `;
                listEl.appendChild(item);
            });
        }

        window.deleteCode = async function(codeId) {
            if (confirm(`シリアルコード「${codeId}」を削除しますか？\n※この操作は取り消せません。`)) {
                try {
                    await deleteDoc(doc(db, "codes", codeId));
                    alert(`コード「${codeId}」を削除しました`);
                    await refreshData();
                } catch (error) {
                    console.error("Error deleting code:", error);
                    alert("コードの削除に失敗しました");
                }
            }
        };

        window.filterCodes = function() {
            const keyword = document.getElementById('code-search-input').value.trim().toUpperCase();
            const filtered = cachedCodes.filter(c => c.id.includes(keyword));
            renderCodesList(filtered);
        };

        window.resetSingleRedemption = async function(codeId, storeId) {
            if (confirm(`コード「${codeId}」の「${storeId}」での利用履歴を取り消しますか？`)) {
                try {
                    const docRef = doc(db, "codes", codeId);
                    await updateDoc(docRef, {
                        used_stores: arrayRemove(storeId)
                    });
                    alert('利用履歴を取り消しました');
                    await refreshData();
                } catch (e) {
                    console.error("Reset error:", e);
                    alert("リセットに失敗しました");
                }
            }
        };

        window.generateCodes = async function() {
            const prefix = document.getElementById('code-prefix').value.trim() || 'ONO';
            const count = parseInt(document.getElementById('code-count').value, 10);

            if (!count || count <= 0) {
                alert('枚数を指定してください');
                return;
            }

            if (confirm(`${prefix}-0001 から ${count}個のコードをDBに登録しますか？`)) {
                try {
                    for (let i = 1; i <= count; i++) {
                        const numStr = String(i).padStart(4, '0');
                        const code = `${prefix}-${numStr}`;
                        await setDoc(doc(db, "codes", code), {
                            code: code,
                            used_stores: []
                        }, { merge: true });
                    }
                    alert(`${count}件のコード発行が完了しました！`);
                    await refreshData();
                } catch (error) {
                    console.error("Error generating codes:", error);
                    alert('コード発行に失敗しました');
                }
            }
        };

        window.openQRModal = function() {
            const container = document.getElementById('qr-print-container');
            container.innerHTML = '';
            document.getElementById('qr-modal').classList.remove('hidden');

            const baseUrl = window.location.href.replace('admin.html', 'index.html');

            cachedCodes.forEach(c => {
                const targetUrl = `${baseUrl}?code=${c.id}`;
                const card = document.createElement('div');
                card.className = 'border p-3 rounded text-center bg-white flex flex-col items-center justify-center';
                card.innerHTML = `
                    <div id="qr-${c.id}" class="mb-2"></div>
                    <div class="font-mono text-xs font-bold">${c.id}</div>
                `;
                container.appendChild(card);

                new QRCode(document.getElementById(`qr-${c.id}`), {
                    text: targetUrl,
                    width: 90,
                    height: 90
                });
            });
        };

        window.closeQRModal = function() {
            document.getElementById('qr-modal').classList.add('hidden');
        };
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen">

    <header class="bg-gray-800 text-white p-4 text-center font-bold shadow">
        ⚙️ 小野めぐり珈琲バッグ 管理者ページ
    </header>

    <main class="max-w-lg mx-auto p-4 pb-16">

        <!-- ログイン画面 -->
        <section id="login-view" class="bg-white p-6 rounded-xl shadow-md mt-10">
            <h2 class="font-bold text-center text-lg mb-4 text-gray-700">管理者ログイン</h2>
            <div class="bg-amber-50 border-l-4 border-amber-500 p-3 mb-4 text-xs text-amber-800">
                💡 <strong>ヒント:</strong> 製作者のyoutubeサイトは？？
            </div>
            <div class="space-y-4">
                <input type="password" id="pass-input" placeholder="パスワードを入力" class="w-full border p-3 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-600" onkeydown="if(event.key==='Enter') checkPassword()">
                <button onclick="checkPassword()" class="w-full bg-amber-800 text-white font-bold py-3 rounded-lg shadow hover:bg-amber-900 transition">ログイン</button>
            </div>
        </section>

        <!-- 管理ダッシュボード -->
        <section id="admin-dashboard" class="hidden space-y-6">

            <!-- 1. 📊 ダッシュボード・統計 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h3 class="font-bold text-gray-800">📊 利用状況・ダッシュボード</h3>
                    <button onclick="exportCSV()" class="text-xs bg-green-700 hover:bg-green-800 text-white font-bold px-2.5 py-1 rounded transition">📥 CSV出力</button>
                </div>
                
                <div class="grid grid-cols-3 gap-2 text-center mb-4">
                    <div class="bg-amber-50 p-2 rounded-lg border border-amber-100">
                        <div class="text-[10px] text-gray-500">発行総数</div>
                        <div id="stat-total-codes" class="text-lg font-bold text-amber-900">0</div>
                    </div>
                    <div class="bg-blue-50 p-2 rounded-lg border border-blue-100">
                        <div class="text-[10px] text-gray-500">利用開始数</div>
                        <div id="stat-active-codes" class="text-lg font-bold text-blue-900">0</div>
                    </div>
                    <div class="bg-green-50 p-2 rounded-lg border border-green-100">
                        <div class="text-[10px] text-gray-500">延べ利用店舗</div>
                        <div id="stat-total-use" class="text-lg font-bold text-green-900">0</div>
                    </div>
                </div>

                <div class="space-y-1">
                    <div class="text-xs font-bold text-gray-600 mb-2">🏪 店舗別利用回数</div>
                    <div id="analytics-store-ranking" class="space-y-1.5 max-h-36 overflow-y-auto pr-1"></div>
                </div>
            </div>

            <!-- 2. 🏪 店舗追加・編集フォーム -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 id="form-title" class="font-bold text-gray-800 border-b pb-2 mb-4">＋ 参加店舗の追加</h3>
                <div class="space-y-3 text-sm">
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">店舗名</label>
                        <input type="text" id="store-name" placeholder="例: 小野珈琲 ロースターズ" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">消込用4桁PINコード（指定しない場合1234）</label>
                        <input type="text" id="store-pin" value="1234" class="w-full border p-2 rounded font-bold text-amber-800">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">住所</label>
                        <input type="text" id="store-address" placeholder="例: 兵庫県小野市本町1-2" class="w-full border p-2 rounded">
                    </div>
                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">電話番号</label>
                            <input type="tel" id="store-tel" placeholder="例: 0794-xx-xxxx" class="w-full border p-2 rounded">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">営業時間・定休日</label>
                            <input type="text" id="store-hours" placeholder="例: 9:00 - 18:00 (水曜定休)" class="w-full border p-2 rounded">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">公式URL (Webサイト/SNS)</label>
                        <input type="url" id="store-url" placeholder="例: https://example.com" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">店舗画像URL</label>
                        <input type="url" id="store-image-url" placeholder="例: https://example.com/photo.jpg" class="w-full border p-2 rounded">
                    </div>
                    <div>
                        <label class="block text-xs text-gray-500 mb-1">提供特典</label>
                        <textarea id="store-benefit" placeholder="例: お会計から100円引き" class="w-full border p-2 rounded h-16"></textarea>
                    </div>

                    <div class="p-3 bg-amber-50 rounded-lg border border-amber-200 space-y-1">
                        <div class="flex items-center gap-2">
                            <input type="checkbox" id="store-seller" class="rounded border-amber-300 text-amber-600 focus:ring-amber-500">
                            <label for="store-seller" class="text-xs font-bold text-amber-900">☕ 珈琲バッグ設置店舗（販売店）に設定</label>
                        </div>
                        <p class="text-[11px] text-amber-700">※チェックを入れると、QR未認証の一般ユーザーも検索・閲覧できるようになります。</p>
                    </div>

                    <div class="flex items-center gap-2 pt-1">
                        <input type="checkbox" id="store-active" checked class="rounded border-gray-300">
                        <label for="store-active" class="text-xs font-bold text-gray-700">店舗一覧に公開する</label>
                    </div>

                    <div class="flex gap-2 pt-2">
                        <button id="submit-btn" onclick="addStore()" class="flex-1 bg-green-600 text-white font-bold py-2.5 rounded hover:bg-green-700 transition">店舗をデータベースに保存</button>
                        <button id="cancel-edit-btn" onclick="cancelEdit()" class="hidden bg-gray-400 text-white font-bold px-4 rounded hover:bg-gray-500 transition">キャンセル</button>
                    </div>
                </div>
            </div>

            <!-- 3. 🎫 シリアルコード事前発行 & 一括印刷 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <div class="flex justify-between items-center border-b pb-2 mb-4">
                    <h3 class="font-bold text-gray-800">🎫 シリアルコード事前発行</h3>
                    <button onclick="openQRModal()" class="text-xs bg-amber-700 hover:bg-amber-800 text-white font-bold px-2.5 py-1 rounded transition">🖨️ QR画像一覧表示</button>
                </div>
                <div class="space-y-3 text-sm">
                    <div class="flex gap-2">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-1">接頭辞</label>
                            <input type="text" id="code-prefix" value="ONO" class="w-full border p-2 rounded">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 mb-1">発行枚数</label>
                            <input type="number" id="code-count" value="10" class="w-full border p-2 rounded">
                        </div>
                    </div>
                    <button onclick="generateCodes()" class="w-full bg-blue-600 text-white font-bold py-2.5 rounded hover:bg-blue-700 transition">シリアルコードを一括生成・登録</button>
                </div>
            </div>

            <!-- 4. 🔍 シリアルコード管理＆検索 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 class="font-bold text-gray-800 border-b pb-2 mb-3 flex justify-between items-center">
                    <span>🎫 登録済みコード一覧</span>
                    <span id="code-total-count" class="text-xs font-normal text-gray-500"></span>
                </h3>
                <div class="mb-3">
                    <input type="text" id="code-search-input" oninput="filterCodes()" placeholder="🔍 コード番号で検索 (例: ONO-0001)" class="w-full border p-2 rounded text-xs">
                </div>
                <div id="admin-code-list" class="space-y-2 max-h-60 overflow-y-auto">
                    <p class="text-xs text-gray-400 text-center py-2">読み込み中...</p>
                </div>
            </div>

            <!-- 5. 🏪 登録済み店舗一覧 -->
            <div class="bg-white p-5 rounded-xl shadow-sm border">
                <h3 class="font-bold text-gray-800 border-b pb-2 mb-4">🏪 登録済み店舗一覧</h3>
                <div id="admin-store-list" class="space-y-2">
                    <p class="text-xs text-gray-400 text-center py-2">読み込み中...</p>
                </div>
            </div>

        </section>

    </main>

    <!-- 🖨️ QRコード一括印刷用モーダル -->
    <div id="qr-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white rounded-xl p-4 w-full max-w-lg h-[80vh] flex flex-col">
            <div class="flex justify-between items-center border-b pb-2 mb-3">
                <h3 class="font-bold text-gray-800 text-sm">印刷用QRコード一覧</h3>
                <div class="flex gap-2">
                    <button onclick="window.print()" class="bg-blue-600 text-white text-xs font-bold px-3 py-1 rounded">印刷する</button>
                    <button onclick="closeQRModal()" class="bg-gray-400 text-white text-xs font-bold px-3 py-1 rounded">閉じる</button>
                </div>
            </div>
            <div id="qr-print-container" class="grid grid-cols-3 gap-3 overflow-y-auto p-2 flex-1"></div>
        </div>
    </div>

</body>
</html>
